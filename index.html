<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jain Word Housie | Caller</title>
  <meta name="description" content="Caller board for Jain Word Housie. Draw words at random, strike them off the board and check tickets.">
  <meta name="theme-color" content="#fafaf8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/tiro-devanagari-hindi.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/mukta-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <div class="brand">
      <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="12.5"/><circle cx="20" cy="20" r="7"/><circle class="core" cx="20" cy="20" r="2.2"/>
      </svg>
      <div>
        <h1>Jain Word Housie</h1>
        <p>Caller</p>
      </div>
    </div>
    <nav class="actions" aria-label="Game actions">
      <button class="btn" id="checkBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M9 6v12" stroke-dasharray="2 2"/></svg>
        Check a ticket
      </button>
      <button class="btn" id="newBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        New game
      </button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Caller">
      <div class="rings" id="rings">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <g id="ticks"></g>
          <circle class="ring ring-mid" cx="170" cy="170" r="134"/>
          <circle class="ring ring-inner" cx="170" cy="170" r="122"/>
          <circle class="pulse" id="pulse" cx="170" cy="170" r="122"/>
        </svg>
        <div class="word-wrap">
          <div class="current idle" id="current" aria-live="polite">Press draw to call the first word</div>
          <p class="count" id="countText">0 of 90 called</p>
        </div>
      </div>

      <div class="controls">
        <button class="btn-draw" id="drawBtn" type="button">
          <span id="drawLabel">Draw next word</span>
          <kbd>Space</kbd>
        </button>
        <button class="btn-link" id="undoBtn" type="button" hidden>Undo last draw</button>
      </div>

      <div class="recent">
        <h2>Previously called</h2>
        <ol id="recent"></ol>
      </div>
    </section>

    <section class="panel" aria-labelledby="boardTitle">
      <div class="panel-head">
        <h2 id="boardTitle">Board</h2>
        <ul class="legend" aria-label="Legend">
          <li><span class="swatch swatch-latest"></span>Latest</li>
          <li><span class="swatch swatch-called"></span>Called</li>
          <li id="leftText">90 left</li>
        </ul>
      </div>
      <div class="board" id="board"></div>
    </section>
  </main>

  <div class="overlay" id="newDlg" role="dialog" aria-modal="true" aria-labelledby="newTitle">
    <div class="dialog dialog-sm">
      <h2 id="newTitle">Start a new game?</h2>
      <p id="newMsg"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn-danger" id="confirmNew" type="button">Start new game</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="checkDlg" role="dialog" aria-modal="true" aria-labelledby="checkTitle">
    <div class="dialog">
      <h2 id="checkTitle">Check a ticket</h2>
      <div class="check-form">
        <label for="ticketNo">Ticket number</label>
        <input id="ticketNo" type="number" min="1" max="40" inputmode="numeric" autocomplete="off" placeholder="1 to 40">
        <button class="btn" id="showTicket" type="button">Show ticket</button>
      </div>
      <div id="ticketOut"></div>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close>Close</button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
